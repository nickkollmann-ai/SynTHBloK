# Builds SynTHBloK for every platform the VCV Library ships (Windows, Linux, macOS Intel + Apple Silicon)
# on each push, so a change that breaks another OS shows up straight away.
# Pushing a version tag (v2.0.1, made by tools/release.ps1) also publishes a GitHub Release with the
# four .vcvplugin files attached.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  RACK_SDK_VERSION: 2.6.4

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: win-x64, os: windows-latest, sdk: win-x64 }
          - { platform: lin-x64, os: ubuntu-22.04, sdk: lin-x64 }
          - { platform: mac-x64, os: macos-15-intel, sdk: mac-x64+arm64 }
          - { platform: mac-arm64, os: macos-15, sdk: mac-x64+arm64 }
    defaults:
      run:
        shell: ${{ matrix.platform == 'win-x64' && 'msys2 {0}' || 'bash' }}
    steps:
      - uses: actions/checkout@v4

      - name: MSYS2 (Windows)
        if: matrix.platform == 'win-x64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make tar zstd unzip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-jq

      - name: Tools (Linux)
        if: matrix.platform == 'lin-x64'
        run: sudo apt-get update && sudo apt-get install -y jq zstd unzip

      - name: Tools (macOS)
        if: startsWith(matrix.platform, 'mac')
        run: brew install jq zstd || true

      - name: Rack SDK ${{ env.RACK_SDK_VERSION }}
        run: |
          curl -fsSL -o sdk.zip "https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-${{ matrix.sdk }}.zip"
          unzip -q sdk.zip -d "$HOME"
          rm sdk.zip
          echo "RACK_DIR=$HOME/Rack-SDK" >> "$GITHUB_ENV"

      - name: Build
        run: make dist -j4 RACK_DIR="$RACK_DIR"

      - uses: actions/upload-artifact@v4
        with:
          name: SynTHBloK-${{ matrix.platform }}
          path: dist/*.vcvplugin
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Check the tag matches plugin.json
        run: |
          v=$(jq -r .version plugin.json)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "plugin.json says $v but the tag is ${GITHUB_REF_NAME}"; exit 1; }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" packages/*.vcvplugin \
            --title "SynTHBloK $GITHUB_REF_NAME" --generate-notes
