<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="300"
     viewBox="0 0 800 300">

  <!-- Background -->
  <rect x="0" y="0" width="800" height="300" fill="#0D0D0D"/>

  <!-- Common defs -->
  <defs>
    <!-- Simple rounded techno font substitute via path styling -->
    <style type="text/css"><![CDATA[
      .logo-text {
        font-family: "Eurostile", "Rajdhani", "Segoe UI", sans-serif;
        font-weight: 700;
        letter-spacing: 4px;
      }
      .logo-main {
        fill: #FFFFFF;
      }
      .logo-accent {
        fill: #0FAF4B;
      }
      .logo-copper {
        fill: #CC7A00;
      }
      .logo-stroke {
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    ]]></style>
  </defs>

  <!-- ========================= -->
  <!-- MAIN LOGO (centered)      -->
  <!-- ========================= -->

  <!-- PCB underline trace -->
  <g transform="translate(120, 170)">
    <!-- Main trace line -->
    <path d="M 0 0 L 560 0"
          fill="none"
          stroke="#0FAF4B"
          stroke-width="3"
          class="logo-stroke"/>

    <!-- Left via -->
    <circle cx="40" cy="0" r="6"
            fill="#0D0D0D"
            stroke="#0FAF4B"
            stroke-width="3"/>

    <!-- Right via -->
    <circle cx="520" cy="0" r="6"
            fill="#0D0D0D"
            stroke="#0FAF4B"
            stroke-width="3"/>
  </g>

  <!-- Text group -->
  <g transform="translate(120, 150)">
    <!-- NOIZEE -->
    <text x="0" y="0"
          font-size="52"
          class="logo-text logo-main">
      N
    </text>

    <!-- O as PCB pad -->
    <g transform="translate(60, -38)">
      <!-- Outer pad -->
      <circle cx="0" cy="0" r="20"
              fill="#0D0D0D"
              stroke="#0FAF4B"
              stroke-width="4"/>
      <!-- Inner via -->
      <circle cx="0" cy="0" r="6"
              fill="#0FAF4B"/>
    </g>

    <!-- I Z E E -->
    <text x="110" y="0"
          font-size="52"
          class="logo-text logo-main">
      I Z E E
    </text>

    <!-- Tiny SMD LED dot on I -->
    <circle cx="118" cy="-26" r="3"
            fill="#CC7A00"/>

    <!-- TOYZ -->
    <text x="0" y="60"
          font-size="46"
          class="logo-text logo-main">
      TOY
    </text>

    <!-- Z as lightning‑bolt PCB trace -->
    <g transform="translate(210, 20)">
      <path d="M 0 -20 L 22 -20 L 6 10 L 26 10 L 4 40"
            fill="none"
            stroke="#0FAF4B"
            stroke-width="4"
            class="logo-stroke"/>
    </g>
  </g>

  <!-- ========================= -->
  <!-- ICON (left side)          -->
  <!-- ========================= -->

  <g transform="translate(90, 80)">
    <!-- Outer circle (panel badge) -->
    <circle cx="0" cy="0" r="40"
            fill="#0D0D0D"
            stroke="#0FAF4B"
            stroke-width="4"/>

    <!-- Top pad (O) -->
    <circle cx="0" cy="-16" r="10"
            fill="#0D0D0D"
            stroke="#0FAF4B"
            stroke-width="3"/>

    <!-- Middle trace (Z-ish) -->
    <path d="M -12 -4 L 12 -4 L -8 12 L 10 12"
          fill="none"
          stroke="#CC7A00"
          stroke-width="3"
          class="logo-stroke"/>

    <!-- Bottom via (toy dot) -->
    <circle cx="0" cy="24" r="6"
            fill="#0FAF4B"/>
  </g>

  <!-- Optional label under icon -->
  <text x="50" y="250"
        font-size="18"
        class="logo-text logo-accent">
    NOIZEE TOYZ
  </text>

</svg>
