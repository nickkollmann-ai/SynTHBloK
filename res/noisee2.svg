<svg xmlns="http://www.w3.org/2000/svg"
     width="900" height="320"
     viewBox="0 0 900 320">

  <!-- Background -->
  <rect x="0" y="0" width="900" height="320" fill="#050505"/>

  <defs>
    <style type="text/css"><![CDATA[
      .txt {
        font-family: "Eurostile", "Orbitron", "Rajdhani", sans-serif;
        font-weight: 700;
        letter-spacing: 6px;
      }
      .white { fill: #FFFFFF; }
      .green { fill: #00FF9C; }
      .copper { fill: #FF7A00; }
      .stroke { stroke-linecap: round; stroke-linejoin: round; }
    ]]></style>
  </defs>

  <!-- ========================= -->
  <!-- FUTURISTIC ICON (LEFT)    -->
  <!-- ========================= -->

  <g transform="translate(110, 160)">
    <!-- Outer hex frame -->
    <polygon points="0,-55 48,-28 48,28 0,55 -48,28 -48,-28"
             fill="#050505"
             stroke="#00FF9C"
             stroke-width="4"/>

    <!-- Top pad -->
    <circle cx="0" cy="-22" r="12"
            fill="#050505"
            stroke="#00FF9C"
            stroke-width="3"/>

    <!-- Angular Z‑trace -->
    <path d="M -18 -2 L 22 -2 L -10 22 L 20 22"
          fill="none"
          stroke="#FF7A00"
          stroke-width="4"
          class="stroke"/>

    <!-- Bottom via -->
    <circle cx="0" cy="32" r="7"
            fill="#00FF9C"/>
  </g>

  <!-- ========================= -->
  <!-- FUTURISTIC LOGO (RIGHT)   -->
  <!-- ========================= -->

  <!-- Underline trace -->
  <g transform="translate(200, 210)">
    <path d="M 0 0 L 620 0"
          fill="none"
          stroke="#00FF9C"
          stroke-width="3"
          class="stroke"/>

    <!-- Vias -->
    <circle cx="60" cy="0" r="6"
            fill="#050505"
            stroke="#00FF9C"
            stroke-width="3"/>
    <circle cx="560" cy="0" r="6"
            fill="#050505"
            stroke="#00FF9C"
            stroke-width="3"/>
  </g>

  <!-- NOIZEE -->
  <g transform="translate(200, 150)">
    <text x="0" y="0" font-size="60" class="txt white">N</text>

    <!-- Futuristic PCB‑pad O -->
    <g transform="translate(75, -42)">
      <circle cx="0" cy="0" r="24"
              fill="#050505"
              stroke="#00FF9C"
              stroke-width="5"/>
      <circle cx="0" cy="0" r="8"
              fill="#00FF9C"/>
    </g>

    <text x="140" y="0" font-size="60" class="txt white">I Z E E</text>

    <!-- LED dot on I -->
    <circle cx="150" cy="-30" r="4" fill="#FF7A00"/>
  </g>

  <!-- TOYZ -->
  <g transform="translate(200, 220)">
    <text x="0" y="0" font-size="52" class="txt white">T O Y</text>

    <!-- Aggressive lightning‑bolt Z -->
    <g transform="translate(260, -10)">
      <path d="M 0 -25 L 40 -25 L 10 10 L 50 10 L 5 45"
            fill="none"
            stroke="#00FF9C"
            stroke-width="5"
            class="stroke"/>
    </g>
  </g>

</svg>
